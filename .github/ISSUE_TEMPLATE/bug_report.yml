name: Bug report
description: Help us reproduce a problem with the app or runtime.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! English and 繁體中文 are welcome. Please remove SDK tokens, pairing data and private chat content from attachments. Setup questions can go to Discussions.
  - type: input
    id: version
    attributes:
      label: App version and build
      placeholder: 0.3 source build, universal, commit SHA if known
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Chromecast with Google TV 4K, Android 12 / API 31
    validations:
      required: true
  - type: input
    id: abi
    attributes:
      label: ABI and page size, if known
      description: Optional — adb shell getprop ro.product.cpu.abi and adb shell getconf PAGE_SIZE
      placeholder: armeabi-v7a, 4096
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open…\n2. Select…\n3. Observe…"
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected and actual result
      description: Include the exact error or status text if one appeared.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted screenshot or relevant logs
      description: Short excerpts are enough. Never upload pairing.json, SDK tokens or an entire unreviewed logcat.
