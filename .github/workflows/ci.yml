name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Chaquopy builds against the exact minor on PATH.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3

      - name: Lint (includes full 4-ABI compile)
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Python overlay tests
        run: |
          python3.11 -m pip install -q pytest
          PYTHONPATH=app/src/main/python:vendor/muse-gadget-sdk/linux/src \
            python3.11 -m pytest app/src/main/python/androidtv/tests/ -q
