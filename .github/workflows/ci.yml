name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Chaquopy builds against the exact minor on PATH.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Runners already ship an SDK; just point at it and accept
      # licenses. (android-actions/setup-android is broken against
      # current cmdline-tools — it wants the obsolete `tools` package.)
      # AGP downloads platform/build-tools 35 itself on first build.
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v3

      - name: Lint (includes full 4-ABI compile)
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Python overlay tests
        run: |
          python3.11 -m pip install -q pytest
          PYTHONPATH=app/src/main/python:vendor/muse-gadget-sdk/linux/src \
            python3.11 -m pytest app/src/main/python/androidtv/tests/ -q
